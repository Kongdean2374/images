<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>這裡沒有東西｜柴柴 ChaiChai</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/favicon.png" sizes="64x64" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+TC:wght@900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.nf{min-height:100svh;display:flex;flex-direction:column;align-items:flex-start;
    justify-content:center;padding:var(--pad);max-width:var(--maxw);margin:0 auto}
.nf__code{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--lamp);margin:0 0 18px}
.nf__t{margin:0;font-family:var(--serif);font-weight:900;
       font-size:clamp(30px,7vw,58px);line-height:1.3;color:#f6ecdd}
.nf__p{margin:20px 0 34px;font-size:15px;line-height:2;color:var(--tx-2);max-width:34ch}
</style>
</head>
<body>
<canvas id="starfield" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>
<main class="nf">
  <p class="nf__code">404 ・ 這條路沒有燈</p>
  <h1 class="nf__t">你走到沒有東西的地方了。</h1>
  <p class="nf__p">這個網址不存在，或是已經被我改掉了。回首頁看看吧，那邊燈還開著。</p>
  <a class="btn btn--main" href="/">回首頁</a>
</main>
<script src="script.js" defer></script>
</body>
</html>
