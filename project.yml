name: MoneyLeft
options:
  bundleIdPrefix: com.moneyleft
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    SWIFT_EMIT_LOC_STRINGS: "YES"
    ENABLE_BITCODE: "NO"
    DEAD_CODE_STRIPPING: "YES"

targets:
  MoneyLeft:
    type: application
    platform: iOS
    sources:
      - path: MoneyLeft
      - path: Shared
    dependencies:
      - target: MoneyLeftWidget
        embed: true
        codeSign: false
    settings:
      base:
        PRODUCT_NAME: MoneyLeft
        PRODUCT_BUNDLE_IDENTIFIER: com.moneyleft.app
        INFOPLIST_FILE: MoneyLeft/Info.plist
        CODE_SIGN_ENTITLEMENTS: MoneyLeft/MoneyLeft.entitlements
        GENERATE_INFOPLIST_FILE: "NO"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  MoneyLeftWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: MoneyLeftWidget
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: MoneyLeftWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.moneyleft.app.widget
        INFOPLIST_FILE: MoneyLeftWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: MoneyLeftWidget/MoneyLeftWidget.entitlements
        GENERATE_INFOPLIST_FILE: "NO"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: "YES"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground

schemes:
  MoneyLeft:
    build:
      targets:
        MoneyLeft: all
        MoneyLeftWidget: [run, archive]
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
